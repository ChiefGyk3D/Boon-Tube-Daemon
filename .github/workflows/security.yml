# CodeQL, gitleaks, pip-audit, dependency review on pull requests, and Snyk
# (token from Doppler). The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 06:00 UTC, so new advisories surface between commits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@5df66539de085aff73dcf1f2957615689b846298 # v1.2.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-queries: security-extended,security-and-quality
      pip-audit-requirements: requirements.txt
      # nltk 3.10.3 carries PYSEC-2026-3740 with no fixed release yet. Ignored
      # by ID so the job stays strict for everything else; drop this line
      # when a fixed nltk ships and the pin moves.
      pip-audit-extra-args: --ignore-vuln PYSEC-2026-3740
      # The same advisory as GitHub names it, for dependency review. Both IDs
      # are one entry in git-your-ship-together's baseline/risk-register.yaml,
      # reviewed by 2026-12-20; the audit fails if that entry lapses.
      dependency-review-allow-ghsas: GHSA-8mgp-746c-j5xp
      snyk: true
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
